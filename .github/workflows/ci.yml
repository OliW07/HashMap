name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install -y g++-14

      - name: Configure
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build

      - name: Test
        run: ./build/hashmapTest
